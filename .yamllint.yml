extends: default
ignore: |
  .venv/
rules:
  line-length:
    max: 140
    level: warning
  truthy:
    allowed-values: ["true", "false", "on"]
  comments-indentation: disable
  document-start: disable
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
