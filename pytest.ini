[pytest]
testpaths = tests
# `make test` runs everything except the fleet tests; `make test-e2e` and
# `make test-rollback` select them explicitly with -m.
addopts = -m "not e2e and not rollback"
markers =
    e2e: read-only checks against the live fleet from `make deploy`
    rollback: ships a broken release to one live node to test automatic rollback
