[defaults]
inventory            = ansible/inventory/hosts.ini
host_key_checking    = False
retry_files_enabled  = False
# community.general.yaml was removed in community.general 12.0.0+, superseded
# by result_format=yaml on the built-in default callback (ansible-core 2.13+).
stdout_callback      = default
roles_path           = ansible/roles

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True
