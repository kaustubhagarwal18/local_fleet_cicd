---
- name: Verify
  hosts: all
  become: true
  vars_files:
    - ../../inventory/group_vars/all.yml
  tasks:
    - name: Fleet directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/llama-fleet
        - "{{ model_dir }}"
        - "{{ llama_release_dir }}"
        - "{{ log_dir }}"
      register: molecule_dirs

    - name: Assert directories present
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.isdir
        fail_msg: "{{ item.item }} is missing"
      loop: "{{ molecule_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the checked-out llama.cpp tags
      ansible.builtin.command:
        cmd: git -C {{ llama_build_dir }} tag --points-at HEAD
      register: molecule_git_tags
      changed_when: false

    - name: Assert the pinned llama.cpp release was built
      ansible.builtin.assert:
        that: llama_cpp_ref in molecule_git_tags.stdout_lines
        fail_msg: "HEAD is not {{ llama_cpp_ref }} (tags at HEAD: {{ molecule_git_tags.stdout_lines }})"

    - name: Read the staged release path
      ansible.builtin.slurp:
        src: "{{ llama_release_dir }}/.last_built"
      register: molecule_last_built

    - name: Run the staged llama-server binary
      ansible.builtin.command:
        cmd: "{{ (molecule_last_built.content | b64decode).strip() }}/llama-server --version"
      register: molecule_server_version
      changed_when: false

    - name: Assert llama-server runs
      ansible.builtin.assert:
        that: molecule_server_version.rc == 0

    # A release must not load code from the build dir (which the next build
    # overwrites), or rolling back to it would not restore the old code.
    - name: List the staged binary's shared libraries
      ansible.builtin.command:
        cmd: "ldd {{ (molecule_last_built.content | b64decode).strip() }}/llama-server"
      register: molecule_ldd
      changed_when: false

    - name: Assert the release is self-contained
      ansible.builtin.assert:
        that: llama_build_dir not in molecule_ldd.stdout
        fail_msg: "llama-server links libraries from {{ llama_build_dir }}: {{ molecule_ldd.stdout }}"
