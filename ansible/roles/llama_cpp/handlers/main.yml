---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart llama-server
  ansible.builtin.systemd:
    name: llama-server
    state: restarted
    enabled: true

- name: Restart metrics-exporter
  ansible.builtin.systemd:
    name: metrics-exporter
    state: restarted
    enabled: true
