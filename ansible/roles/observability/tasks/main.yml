---
- name: Ship the metrics exporter script
  ansible.builtin.copy:
    src: ../../../../scripts/metrics_exporter.py
    dest: /opt/llama-fleet/metrics_exporter.py
    mode: "0755"

- name: Render local prometheus scrape stub (for on-node debugging)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/llama-fleet/prometheus.local.yml
    mode: "0644"
