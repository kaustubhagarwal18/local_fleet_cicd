---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - git
      - curl
      - jq
      - python3-pip
    state: present

- name: Create fleet directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - /opt/llama-fleet
    - "{{ model_dir }}"
    - "{{ llama_release_dir }}"
    - "{{ log_dir }}"

- name: Configure logrotate for structured JSON logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/llama-fleet
    mode: "0644"
    content: |
      {{ log_dir }}/*.jsonl {
        daily
        rotate 7
        compress
        missingok
        notifempty
      }
